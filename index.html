    <!-- ================= 2. DYNAMIC FOOTER INJECTION ================= -->
    <!-- ================= DYNAMIC FOOTER INJECTION ================= -->
    <div data-include="include/footer.html"></div>

    <!-- ================= TOP-TO-BOTTOM SLIDE DRAWER SCRIPT ================= -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            // --- Step 1: Load HTML Partials (Header & Footer) ---
            const includes = document.querySelectorAll("[data-include]");

            for (const el of includes) {
                const filePath = el.getAttribute("data-include");
                try {
                    const response = await fetch(filePath);
                    if (!response.ok) {
                        throw new Error(`Failed to load ${filePath}: ${response.statusText}`);
                    }
                    const htmlContent = await response.text();
                    el.innerHTML = htmlContent;
                } catch (error) {
                    console.error("Error loading include:", error);
                    el.innerHTML = `<p class="text-red-400 text-xs py-2">Failed to load ${filePath}</p>`;
                }
            }
        });

        // --- Step 2: Event Delegation for Top-to-Bottom Slide Drawer ---
        document.addEventListener("click", (e) => {
            const openBtn = e.target.closest("#open-mobile-menu");
            const closeBtn = e.target.closest("#close-mobile-menu");
            const mobileMenu = document.getElementById("mobile-menu");

            if (!mobileMenu) return;

            // OPEN: Slide down from the top (-translate-y-full -> translate-y-0)
            if (openBtn) {
                mobileMenu.classList.remove("-translate-y-full");
                mobileMenu.classList.add("translate-y-0");
                document.body.style.overflow = "hidden"; // Prevent background scrolling
                return;
            }

            // CLOSE: Slide back up to the top (translate-y-0 -> -translate-y-full)
            const clickedMenuLink = e.target.closest("#mobile-menu nav a, #mobile-menu div a");
            if (closeBtn || clickedMenuLink) {
                mobileMenu.classList.remove("translate-y-0");
                mobileMenu.classList.add("-translate-y-full");
                document.body.style.overflow = ""; // Restore background scrolling
            }
        });
    </script>

    <!--  -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            // --- Step 1: Load HTML Partials (Header & Footer) ---
            const includes = document.querySelectorAll("[data-include]");

            for (const el of includes) {
                const filePath = el.getAttribute("data-include");
                try {
                    const response = await fetch(filePath);
                    if (!response.ok) {
                        throw new Error(`Failed to load ${filePath}: ${response.statusText}`);
                    }
                    const htmlContent = await response.text();
                    el.innerHTML = htmlContent;
                } catch (error) {
                    console.error("Error loading include:", error);
                    el.innerHTML = `<p class="text-red-400 text-xs py-2">Failed to load ${filePath}</p>`;
                }
            }
        });

        // --- Step 2: Event Delegation for UI Controls ---
        document.addEventListener("click", (e) => {
            // 1. BACK TO TOP BUTTON HANDLER
            const backToTopBtn = e.target.closest("#back-to-top");
            if (backToTopBtn) {
                e.preventDefault();
                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
                return;
            }

            // 2. MOBILE MENU DRAWER HANDLER
            const openBtn = e.target.closest("#open-mobile-menu");
            const closeBtn = e.target.closest("#close-mobile-menu");
            const mobileMenu = document.getElementById("mobile-menu");

            if (!mobileMenu) return;

            // OPEN: Slide drawer down and lock scrolling
            if (openBtn) {
                mobileMenu.classList.remove("-translate-y-full");
                mobileMenu.classList.add("translate-y-0");
                document.body.style.overflow = "hidden";
                document.documentElement.style.overflow = "hidden";
                return;
            }

            // CLOSE: Slide drawer up and restore scrolling
            const clickedMenuLink = e.target.closest("#mobile-menu nav a, #mobile-menu div a");
            if (closeBtn || clickedMenuLink) {
                mobileMenu.classList.remove("translate-y-0");
                mobileMenu.classList.add("-translate-y-full");
                document.body.style.overflow = "";
                document.documentElement.style.overflow = "";
            }
        });
    </script>
</body>
