<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- ================= HEADER SECTION ================= -->
    <!-- ================= HEADER SECTION ================= -->
    <header class="w-full border-b border-white/[0.08] bg-[#0A1325]/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">

            <!-- Brand Logo -->
            <a href="../index.html" class="flex flex-col group">
                <img src="images/logo.png" alt="PEQON Logo"
                    class="h-12 w-auto transition-transform duration-300 group-hover:scale-105" />
            </a>

            <!-- Desktop Navigation Links -->
            <nav class="hidden md:flex items-center space-x-8 text-sm font-medium text-gray-300">
                <a href="../product.html" class="hover:text-white transition-colors">Products</a>
                <a href="../about-us.html" class="hover:text-white transition-colors">About</a>
                <a href="../gallery.html" class="hover:text-white transition-colors">Gallery</a>
                <a href="../contact.html" class="hover:text-white transition-colors">Contact</a>
            </nav>

            <!-- Header Action Controls -->
            <div class="flex items-center space-x-3 sm:space-x-4">
                <!-- Search Button -->
                <!-- <button aria-label="Search"
                    class="hidden sm:flex w-10 h-10 rounded-full bg-white/[0.06] border border-white/10 flex items-center justify-center text-gray-300 hover:text-white hover:bg-white/10 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </button> -->

                <!-- Call Button -->
                <button aria-label="Call Support"
                    class="hidden sm:flex w-10 h-10 rounded-full bg-white/[0.06] border border-white/10 items-center justify-center text-gray-300 hover:text-white hover:bg-white/10 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                    </svg>
                </button>

                <!-- Get Quote CTA Pill -->
                <a href="../contact.html"
                    class="hidden sm:flex px-5 py-2.5 rounded-full bg-gradient-to-r from-[#FBC24A] to-[#F3A833] text-[#0A1325] font-semibold text-sm shadow-glow-gold hover:brightness-110 transition duration-200">
                    Get Quote
                </a>

                <!-- Mobile Menu Open Button -->
                <button id="open-mobile-menu" aria-label="Open Mobile Menu"
                    class="md:hidden text-gray-300 hover:text-white p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>

        </div>

        <!-- ================= FULL-SCREEN TOP-TO-BOTTOM SLIDING DRAWER ================= -->
        <div id="mobile-menu"
            class="fixed inset-0 z-[100] w-full h-screen bg-[#081022] flex flex-col justify-between px-6 py-5 overflow-y-auto transform -translate-y-full transition-transform duration-500 ease-in-out">

            <!-- Top Bar: Logo + Close X Button -->
            <div class="flex items-center justify-between pb-4 border-b border-white/[0.08]">
                <a href="../index.html" class="flex flex-col">
                    <img src="images/logo.png" alt="PEQON Logo" class="h-10 w-auto" />
                </a>
                <button id="close-mobile-menu" aria-label="Close Menu"
                    class="w-10 h-10 rounded-xl bg-white/[0.06] border border-white/10 flex items-center justify-center text-gray-300 hover:text-white hover:bg-white/10 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- Navigation Links List with Dividers -->
            <nav class="flex flex-col flex-1 mt-6">
                <a href="../product.html"
                    class="py-4 border-b border-white/[0.08] font-serif text-xl font-semibold text-white hover:text-[#FBC24A] transition">
                    Products
                </a>
                <a href="../about-us.html"
                    class="py-4 border-b border-white/[0.08] font-serif text-xl font-semibold text-white hover:text-[#FBC24A] transition">
                    About
                </a>
              
                <a href="../gallery.html"
                    class="py-4 border-b border-white/[0.08] font-serif text-xl font-semibold text-white hover:text-[#FBC24A] transition">
                    Gallery
                </a>
                <a href="../contact.html"
                    class="py-4 border-b border-white/[0.08] font-serif text-xl font-semibold text-white hover:text-[#FBC24A] transition">
                    Contact
                </a>
            </nav>

            <!-- Bottom Call-To-Action Pill -->
            <div class="mt-8 mb-4">
                <a href="#"
                    class="inline-block px-7 py-3 rounded-full bg-gradient-to-r from-[#FBC24A] to-[#F3A833] text-[#0A1325] font-semibold text-sm shadow-glow-gold hover:brightness-110 transition duration-200">
                    Get Quote
                </a>
            </div>

        </div>
    </header>
</body>

</html>
